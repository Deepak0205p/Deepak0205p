<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Deepak Singh Patel â€” Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0.35 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <clipPath id="avatarClip">
      <circle cx="176" cy="170" r="96"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <g filter="url(#soft)">
    <circle cx="980" cy="70" r="130" fill="url(#orbA)">
      <animate attributeName="cx" values="980;1040;980" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="320" r="120" fill="url(#orbB)">
      <animate attributeName="cx" values="540;460;540" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="320;285;320" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="176" cy="170" r="112" fill="url(#orbA)" opacity="0.5"/>
  <circle cx="176" cy="170" r="96" fill="#111827"/>
  <text x="176" y="197" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="700" fill="url(#nameGrad)">DP</text>
  <image href="data:image/png;base64," x="80" y="74" width="192" height="192" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="176" cy="170" r="103" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="176" cy="170" r="113" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.45"/>

  <text x="330" y="112" font-family="'Fira Code','Consolas',monospace" font-size="18" fill="#38BDF8" letter-spacing="2">hey, I'm</text>

  <text x="330" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="700" fill="url(#nameGrad)">Deepak Singh Patel</text>

  <text x="332" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#94A3B8">Full-Stack Developer &#183; System Architecture &#183; Local AI Workflows</text>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="330" y="246" width="86" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="373" y="268" fill="#7DD3FC" text-anchor="middle">Python</text>

    <rect x="428" y="246" width="66" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text x="461" y="268" fill="#C4B5FD" text-anchor="middle">C++</text>

    <rect x="506" y="246" width="84" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.6"/>
    <text x="548" y="268" fill="#7DD3FC" text-anchor="middle">Docker</text>

    <rect x="602" y="246" width="84" height="34" rx="17" fill="#EC4899" fill-opacity="0.12" stroke="#EC4899" stroke-opacity="0.6"/>
    <text x="644" y="268" fill="#F9A8D4" text-anchor="middle">AI / ML</text>

    <rect x="698" y="246" width="124" height="34" rx="17" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.6"/>
    <text x="760" y="268" fill="#86EFAC" text-anchor="middle">Open Source</text>
  </g>

  <rect x="940" y="284" width="214" height="36" rx="18" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.6"/>
  <circle cx="966" cy="302" r="6" fill="#22C55E">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="982" y="307" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#86EFAC">Open to internships</text>

  <rect x="0" y="332" width="1200" height="8" fill="url(#bar)"/>
</svg>
