<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Thanks for visiting">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0.35 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
    </pattern>

    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="170" fill="url(#bg2)"/>
  <rect width="1200" height="170" fill="url(#grid2)"/>

  <rect x="0" y="0" width="1200" height="8" fill="url(#bar2)"/>

  <path fill="none" stroke="url(#wave)" stroke-width="4" opacity="0.9"
        d="M0 130 C 200 100, 400 160, 600 130 S 1000 100, 1200 130">
    <animate attributeName="d"
             values="M0 130 C 200 100, 400 160, 600 130 S 1000 100, 1200 130; M0 130 C 200 160, 400 100, 600 130 S 1000 160, 1200 130; M0 130 C 200 100, 400 160, 600 130 S 1000 100, 1200 130"
             dur="7s" repeatCount="indefinite"/>
  </path>

  <text x="600" y="70" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="700" fill="url(#textGrad)">Thanks for visiting</text>

  <text x="600" y="104" text-anchor="middle" font-family="'Fira Code','Consolas',monospace" font-size="16" fill="#94A3B8">crafted with HTML + hand-drawn SVG &#183; github.com/Deepak0205p</text>
</svg>
